name: google_map_one_for_all
description: "Comprehensive Google Maps tutorial suite for Flutter (Android & iOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.2
  custom_info_window: ^1.0.1
  # Map Mastery module dependencies
  flutter_bloc: ^9.1.0
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/